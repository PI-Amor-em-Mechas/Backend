version: '3.9'
services:
  mysql:
    image: mysql:8.4
    container_name: evolution-bot-mysql
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: evolution_bot
      MYSQL_TCP_PORT: "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    network_mode: host
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    network_mode: host
    restart: unless-stopped
    environment:
      - SERVER_PORT=8081
      - AUTHENTICATION_API_KEY=${EVOLUTION_GLOBAL_API_KEY:-minha-chave-global}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@127.0.0.1:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://127.0.0.1:6379
      - CACHE_LOCAL_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://127.0.0.1:8080/webhooks/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: evolution-bot-app
    container_name: evolution-bot-app
    network_mode: host
    environment:
      DB_URL: jdbc:mysql://127.0.0.1:3306/evolution_bot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EVOLUTION_BASE_URL: http://127.0.0.1:8081
      EVOLUTION_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-minha-chave-global}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-default}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-meu-token-webhook}
    restart: unless-stopped

volumes:
  mysql_data:
  evolution_instances:
  evolution_pg_data:
  redis_data:
