server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evolution_bot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.evolutionbot=INFO

integration.evolution.base-url=${EVOLUTION_BASE_URL:http://localhost:8081}
integration.evolution.api-key=${EVOLUTION_API_KEY:change-me}
integration.evolution.instance=${EVOLUTION_INSTANCE:default}
integration.evolution.webhook-token=${EVOLUTION_WEBHOOK_TOKEN:change-me}
