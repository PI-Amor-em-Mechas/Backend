spring.application.name=api-para-formulario

# ============================================================
# CONFIGURACAO DE BANCO DE DADOS
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/amor_em_mechas?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=apiuser
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080

# ============================================================
# HL7 SECURITY - Configuracoes de Seguranca para Dados Medicos
# ============================================================

# JWT Configuration
# IMPORTANTE: Em producao, use uma chave secreta forte de no minimo 256 bits (32 bytes)
# Gere com: openssl rand -base64 32
hl7.security.jwt.secret=${JWT_SECRET:aW1wb3J0YW50ZS1jaGF2ZS1zZWNyZXRhLXBhcmEtcHJvZHVjYW8tYW1vci1lbS1tZWNoYXMtaGw3}
# Access token expira em 15 minutos (900000ms) - conformidade HL7 sessao curta
hl7.security.jwt.expiration-ms=900000
# Refresh token expira em 8 horas (28800000ms)
hl7.security.jwt.refresh-expiration-ms=28800000

# Chave AES-256 para criptografia de dados medicos em repouso (PHI at rest)
# IMPORTANTE: Em producao, use variavel de ambiente. Gere com: openssl rand -base64 32
hl7.security.encryption.key=${PHI_ENCRYPTION_KEY:YTJiM2M0ZDVlNmY3ZzhoOWkwajFrMmwzbTRuNW82cDc=}

# CORS - Origens permitidas (separadas por virgula)
hl7.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

# ============================================================
# SWAGGER UI (desenvolvimento apenas)
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# ACTUATOR (monitoramento - restringir em producao)
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# UPLOAD DE ARQUIVOS
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Diretorio de armazenamento de arquivos (filesystem ao inves de BLOB)
app.upload.dir=${UPLOAD_DIR:uploads}

# ============================================================
# LOGGING DE SEGURANCA
# ============================================================
logging.level.org.springframework.security=WARN
logging.level.br.com.amorEmMechas_Formulario.api.para.formulario.security=INFO
