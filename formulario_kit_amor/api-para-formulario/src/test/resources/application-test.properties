# ============================================================
# PERFIL DE TESTE - H2 em memoria
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT para testes (chave fixa de 256 bits)
hl7.security.jwt.secret=dGVzdC1zZWNyZXQta2V5LXBhcmEtdGVzdGVzLWRlLWludGVncmFjYW8tMjU2
hl7.security.jwt.expiration-ms=900000
hl7.security.jwt.refresh-expiration-ms=28800000

# Chave AES-256 para testes
hl7.security.encryption.key=dGVzdC1lbmNyeXB0aW9uLWtleS1wYXJhLXRlc3Rlcw==

# CORS
hl7.security.cors.allowed-origins=http://localhost:3000

# Upload dir temporario para testes
app.upload.dir=${java.io.tmpdir}/test-uploads
